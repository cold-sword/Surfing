    exclude-filter: "(?i)(港|hk|hong ?kong|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|jp|japan|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|us|united ?states|台|新北|彰化|tw|taiwan|taipei|新加坡|坡|狮城|sg|singapore|灾|网易|netease|套餐|重置|剩余|到期|订阅|群|账户|流量|有效期|时间|官网|拒绝|dns|ch|网址|售|防失)"
    expected-status: 204
    <<: *All
  - name: 📌 特殊地址
    icon: "https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@main/app/icon/User.svg"
    type: select
    url: https://www.baidu.com/favicon.ico
    interval: *Time
    proxies:
      - 🌐 本机·本地直连
      - ⛔️ 禁止·拒绝连接
# —————————
rule-anchor:
  Local: &Local
    {type: file, behavior: classical, format: text}
  # 规则集一律直连下载（国内镜像），避免首次启动时规则未加载、走代理失败导致加载不了
  Classical: &Classical
    {type: http, behavior: classical, format: text, interval: *Time, proxy: 🌐 本机·本地直连}
  IPCIDR: &IPCIDR
    {type: http, behavior: ipcidr, format: mrs, interval: *Time, proxy: 🌐 本机·本地直连}
  Domain: &Domain
    {type: http, behavior: domain, format: mrs, interval: *Time, proxy: 🌐 本机·本地直连}
