# —————————
# ==== Tips
# 1. 修改配置文件保存时，需要重启服务/重载配置以生效.
# 2. 如使用 SurfingTile 的配置覆写，当前配置文件的某些字段应保持原有的完整性结构，只新增不改旧原则
# 3. “proxy-groups” 该代理组 “总模式” 位于 SurfingTile 覆写匹配字段，多语言用户可更改 “name” 为 "TotalMode","Total Mode","GlobalMode","Global Mode","Общий режим" 支持大小写。或者使用图标URL “/All.svg” 对该组覆写
# 基础设置
mixed-port: 7890
redir-port: 7891
tproxy-port: 1536
ipv6: true
mode: Rule
allow-lan: true
disable-keep-alive: true
geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
updatetime: &Time 86400
geox-url:
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
unified-delay: true
tcp-concurrent: true
log-level: silent # debug / silent
find-process-mode: always
proxy_fp: &proxy_fp
  client-fingerprint: chrome
external-controller: 127.0.0.1:9090 #修改端口后，如使用磁贴请重新正确设置API端口；仅本机访问，如需局域网管理请改回 0.0.0.0 并设置 secret
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
external-ui: "./webroot/Zash/"
secret: "" # 面板访问密码，如在公网访问建议设置
# 内置对时：设备时间不准时 VMess / TLS 仍可用，不改系统时间
ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 30
# —————————
# 健康检查
p: &p
  type: http
  interval: *Time
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    expected-status: 204 # 只认真正的 204，被劫持返回拦截页的节点不算可用
  proxy: 🔄 订阅更新
  header: # 如遇订阅加载不出来请切换ua
      User-Agent:  # 使用注释法由上到下 默认使用第一个
        - "ClashMetaForAndroid/2.11.2.Meta"
        - "clash-verge/v2.2.3"
        - "ClashforWindows/0.19.23"
        - "clash.meta"
        - "mihomo"
# —————————
# 订阅地址相关（!!! 请勿删除此注释行，模块更新时将根据此行备份/还原您的订阅配置块 !!!）
A: &A
  filter: "^(?!.*(套餐|重置|剩余|到期|订阅|群|账户|流量|有效期|时间|官网|失联|余额)).*$"
  use:
  - "1.主要地址"
  - "2.备用地址"
  - "3.额外地址"
All: &All
  type: url-test
  use:
  - "1.主要地址"
  - "2.备用地址"
  - "3.额外地址"
proxy-providers:
  "1.主要地址":
    <<: *p
    override:
      additional-prefix: "Main："
      <<: *proxy_fp
    path: "./proxies/1.主要地址.yaml"
    url: "此处引入您的Clash订阅链接地址"
  "2.备用地址":
    <<: *p
    override:
      additional-prefix: "Minor："
      <<: *proxy_fp
    path: "./proxies/2.备用地址.yaml"
    url: "此处引入您的Clash订阅链接地址"
  "3.额外地址":
    <<: *p
    override:
      additional-prefix: "Additi："
      <<: *proxy_fp
    path: "./proxies/3.额外地址.yaml"
    url: "此处引入您的Clash订阅链接地址"
# —————————
# 节点记忆
profile: # ← 此行位置请勿变动！此为模块更新时备份恢复订阅的【结束标记】 ↑
  store-selected: true
  store-fake-ip: true
# —————————
# 嗅探模块
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 5228, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain: # 如遇需内部通信的应用请放行该域名
    - "+.io.mi.com"
# —————————
# 网卡模块
# 如需使用 建议先阅读文档：https://wiki.metacubex.one/config/inbound/tun/
tun:
  enable: false
  device: Meta
  # 不写 stack：mihomo ≥ 1.19.32 默认使用自研 MIPS 栈，旧内核回落 gvisor（写死 mips 旧内核会报 invalid tun stack）
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  endpoint-independent-nat: true # UDP 全锥形 NAT：新内核 mips/gvisor 栈已默认如此，此项只对旧内核生效
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  # 如使用黑白名单这里需排除
  # exclude-package 排除 / include-package 包含
  exclude-package:
#    - com.samsung.android.messaging # 三星专供 ↓ 范围
#    - com.samsung.android.app.telephonyui
#    - com.samsung.android.dialer
#    - com.samsung.android.incallui
#    - com.samsung.android.smartcallprovider
#    - com.samsung.android.intellivoiceservice
#    - com.android.settings
#    - com.qti.qcc
#    - com.sec.epdg
#    - com.sec.imsservice # 三星专供 ↑ 范围
    # 非三星用户不必理会，三星用户需自行取消注释 不可使用include-package
# —————————
# Host
hosts: # 如有需求可以使用模块自带的本地挂载，不建议放这里
  services.googleapis.cn: services.googleapis.com
# —————————
# DNS模块
# 请勿随意变动！
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  fake-ip-range: 198.18.0.0/16
  # 不设 fake-ip-range6：box.iptables 将 fc00::/7（含 fdfe:dcba:9876::/64）视为内网直接放行，IPv6 假地址会绕过 TPROXY 导致连接失败
  enhanced-mode: fake-ip # redir-host
  fake-ip-filter:
    - "RULE-SET:CN_域"
    - "RULE-SET:Private_域"
    - "RULE-SET:GoogleFCM_域"
    - "RULE-SET:自定义规则"
    # 系统联网检测 / NTP / 游戏主机 NAT 检测
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.xboxlive.com"
    - "xbox.*.microsoft.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "lens.l.google.com"
  proxy-server-nameserver:
    - https://1.12.12.12:443/dns-query#🌐 本机·本地直连&h3=false
    - https://120.53.53.53:443/dns-query#🌐 本机·本地直连&h3=false
    - https://223.5.5.5:443/dns-query#🌐 本机·本地直连&h3=true
    - https://223.6.6.6:443/dns-query#🌐 本机·本地直连&h3=true
  nameserver-policy:
    # 局域网域名（nas.lan 等）交给路由器
    "RULE-SET:Private_域": system
    "RULE-SET:CN_域,Microsoft_域,Apple_域":
      - https://1.12.12.12:443/dns-query#🌐 本机·本地直连&h3=false
      - https://120.53.53.53:443/dns-query#🌐 本机·本地直连&h3=false
      - https://223.5.5.5:443/dns-query#🌐 本机·本地直连&h3=true
      - https://223.6.6.6:443/dns-query#🌐 本机·本地直连&h3=true
  nameserver:
    # 🔍 Google
    - https://8.8.8.8:443/dns-query#🧭 DNS连接&h3=true
    - https://8.8.4.4:443/dns-query#🧭 DNS连接&h3=true
    # Cloudflare
    - https://1.1.1.1:443/dns-query#🧭 DNS连接&h3=false
    - https://1.0.0.1:443/dns-query#🧭 DNS连接&h3=false
  # 直连流量的解析：国内 DoH，防运营商劫持，CDN 就近
  direct-nameserver:
    - https://1.12.12.12:443/dns-query#🌐 本机·本地直连&h3=false
    - https://120.53.53.53:443/dns-query#🌐 本机·本地直连&h3=false
    - https://223.5.5.5:443/dns-query#🌐 本机·本地直连&h3=true
    - https://223.6.6.6:443/dns-query#🌐 本机·本地直连&h3=true
  direct-nameserver-follow-policy: false
# —————————
proxies:
  - {name: 🌐 本机·本地直连, type: direct, udp: true}
  - {name: ⛔️ 禁止·拒绝连接, type: reject}
  - {name: 🌐 DNS_Hijack, type: dns}
proxy_groups: &proxy_groups
    type: select
    proxies:
      - 🚀 总模式
      - ⚡ ALL·延迟最低
      - ⚖️ ALL·负载均衡
      - 🔁 ALL·故障转移
      - 🇹🇼 ALL·台湾地区
      - 🇭🇰 ALL·香港地区
      - 🇺🇸 ALL·美国地区
      - 🇯🇵 ALL·日本地区
      - 🇸🇬 ALL·狮城地区
      - 🌐 ALL·其它地区
      - ⛔️ 禁止·拒绝连接
      - 🌐 本机·本地直连
    <<: *A
# —————————
proxy-groups:
